gui:
  theme:
    activeBorderColor:
      - blue
      - bold
  nerdFontsVersion: "3"

git:
  log:
    showGraph: 'always'
  paging:
    pager: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    colorArg: always

os:
  editPreset: 'nvim'
customCommands:
  - key: '<c-a>'
    context: 'files'
    description: 'Generate commit message with opencode (copy to clipboard)'
    loadingText: 'Asking opencode for a commit message...'
    command: '~/.config/lazygit/ai-commit-msg.sh'
    output: popup
    outputTitle: 'Commit message (copied to clipboard)'

